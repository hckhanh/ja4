name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "lts"
          cache: true
          registry-url: "https://registry.npmjs.org"

      - name: Install safe-chain
        env:
          SAFE_CHAIN_VERSION: "1.5.25"
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" \
            -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "83069f6db4215cccf6a26bdd6e65a5c2366b9d24322b2d5d2862d47385e56682  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum --check
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci

      - run: vp install

      - name: Lint & format check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp pack

      - name: Install npm
        run: npm install --global --ignore-scripts npm@12.2.0

      - name: Publish to npm
        run: npm publish --provenance

      - name: Publish to JSR
        run: npx --yes --ignore-scripts jsr@0.14.3 publish --allow-dirty

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
