# Validates skill files on PRs that touch the skills/ directory.
# Ensures frontmatter is correct, names match paths, and files stay under
# the 500-line limit.

name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "lts"
          cache: true

      - name: Install safe-chain
        env:
          SAFE_CHAIN_VERSION: "1.5.25"
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" \
            -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "83069f6db4215cccf6a26bdd6e65a5c2366b9d24322b2d5d2862d47385e56682  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum --check
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci

      - run: vp install

      - name: Validate skills
        run: vp exec intent validate skills
